[package]
name = "inplite"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
description = "A lightweight editor for Abaqus input (.inp) files"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "=0.33.3", default-features = false }
memmap2 = "0.9"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[build-dependencies]
embed-resource = "3"

[features]
# Automated screenshot capture for documentation (Linux dev builds only)
shots = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
